# Release pipeline for a local-first Flutter app (Profile A).
#
# Trigger: push a tag like v1.2.0
#   git tag v1.2.0 && git push origin v1.2.0
#
# Produces:
#   - GitHub Release with Linux, Windows and macOS archives and update.json
#     (the signed Android APK is attached manually afterwards, see Caveats)
#   - Web/PWA build on GitHub Pages at https://<owner>.github.io/<repo>/
#   - Multi-arch Docker image ghcr.io/<owner>/<repo>:<version> and :latest
#
# One-time repo setup:
#   - Settings -> Pages -> Source: "GitHub Actions"
#   - Settings -> Pages -> Source: "GitHub Actions" (deploy-web.yml publishes
#     every push to master; this workflow republishes on a tag)
#   - Before tagging: bump apps/client/pubspec.yaml, apps/client/web/update.json
#     and the newest entry of apps/client/assets/release_notes/*.json to the
#     same x.y.z, and set "schemaChange": true there when the release moves
#     Drift's schemaVersion (docs/RELEASING.md)
#
# Caveats:
#   - The Android APK is NOT built here. The maintainer builds and signs it
#     locally with the app's release keystore and uploads it to this release
#     with apps/client/tool/release_apk.sh (FIRMA-ANDROID.md,
#     STACK-APPS-DINAMICAS.md 8.1). Never store the keystore or its passwords
#     in repository secrets.
#   - macOS/Windows builds are unsigned: Gatekeeper/SmartScreen will warn.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR
  pages: write      # deploy GitHub Pages
  id-token: write   # required by actions/deploy-pages

env:
  APP_DIR: apps/client
  # Pinned, not "stable": the toolchain a tag was built with must not change
  # under a rebuild. deploy/Dockerfile defaults to the matching image and the
  # docker job passes this value in, so both paths build with one version.
  FLUTTER_VERSION: 3.47.1
  # github.ref_name and the repository name reach shell scripts through the
  # environment, never through ${{ }} interpolation into the script body:
  # an expression is pasted in as text before the shell ever sees it.
  REPO_NAME: ${{ github.event.repository.name }}
  TAG: ${{ github.ref_name }}

defaults:
  run:
    working-directory: apps/client

jobs:
  # Fails fast if pubspec.yaml version or update.json do not match the tag,
  # or if the compliance gate fails.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check pubspec version matches tag
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "v${PUBSPEC_VERSION}" != "${TAG}" ]; then
            echo "::error::pubspec.yaml version '${PUBSPEC_VERSION}' does not match tag '${TAG}'"
            exit 1
          fi
          if [ -f web/update.json ] && ! grep -q "\"version\"[[:space:]]*:[[:space:]]*\"${PUBSPEC_VERSION}\"" web/update.json; then
            echo "::error::web/update.json version does not match tag '${TAG}'"
            exit 1
          fi
      # Compliance gate (CUMPLIMIENTO.md): legal docs present and filled in,
      # no analytics/ads/tracking packages unless explicitly allowlisted after
      # implementing a consent flow. Space-separated package names.
      - name: Check legal docs and tracking dependencies
        env:
          TRACKING_ALLOWLIST: ""
        run: |
          fail=0
          for doc in ../../PRIVACY.md ../../TERMS.md; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing ${doc#../../} (templates/legal, CUMPLIMIENTO.md)"; fail=1
            elif grep -q '{{' "$doc"; then
              echo "::error::${doc#../../} still contains {{...}} placeholders"; fail=1
            fi
          done
          for pkg in firebase_analytics google_mobile_ads facebook_app_events \
                     appsflyer_sdk adjust_sdk amplitude_flutter mixpanel_flutter \
                     posthog_flutter segment_analytics flutter_branch_sdk \
                     sentry_flutter; do
            if grep -Eq "^[[:space:]]+${pkg}:" pubspec.yaml; then
              case " ${TRACKING_ALLOWLIST} " in
                *" ${pkg} "*) echo "Allowlisted tracking package: ${pkg}" ;;
                *) echo "::error::${pkg} in pubspec.yaml is not in TRACKING_ALLOWLIST (CUMPLIMIENTO.md items 5 and 8)"; fail=1 ;;
              esac
            fi
          done
          exit "$fail"

  # A tag is the commit that reaches users, and it can be pushed from a branch
  # CI never saw or while CI is still red. The same checks as ci.yml run here,
  # and every build job needs them (test/ci/release_workflow_test.dart).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze lib test
      - run: flutter test

  linux:
    needs: [version-check, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf "../../${REPO_NAME}-${TAG}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: "*-linux-x64.tar.gz"

  windows:
    needs: [version-check, check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../../${env:REPO_NAME}-${env:TAG}-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: "*-windows-x64.zip"

  macos:
    needs: [version-check, check]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/${REPO_NAME}-${TAG}-macos.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: "*-macos.zip"

  web-pages:
    needs: [version-check, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Project Pages live under /<repo>/, so base-href must match.
      # GitHub Pages cannot send COOP/COEP headers: Drift falls back to
      # IndexedDB there (works, slower). The Docker image does send them.
      # sw.js is registered relative ('sw.js'), so its scope is /<repo>/.
      - run: flutter build web --release --base-href "/${REPO_NAME}/"
      # SPA fallback for deep links on Pages.
      - run: cp build/web/index.html build/web/404.html
      # Own service worker: inject version + precache manifest (last step
      # that touches build/web). The Docker job does the same in deploy/Dockerfile.
      - run: sh tool/generate_sw.sh build/web pubspec.yaml
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ env.APP_DIR }}/build/web
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  docker:
    needs: [version-check, check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      # The image is served at the root of its own origin: BASE_HREF=/ (default).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_DIR=${{ env.APP_DIR }}
            BASE_HREF=/
            FLUTTER_IMAGE=ghcr.io/cirruslabs/flutter:${{ env.FLUTTER_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: apps/client/web/update.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: if [ -f apps/client/web/update.json ]; then cp apps/client/web/update.json dist/; fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Android:** the maintainer attaches the signed APK
            (`${{ env.REPO_NAME }}-${{ env.TAG }}-android.apk`)
            and its `.sha256` by hand shortly after this release is created
            (`apps/client/tool/release_apk.sh`, docs/SIGNING.md). If they are
            not in Assets yet, check back in a few minutes.

            **Your data stays on your device.** Export a backup from
            Settings → Your data before updating, especially when these notes
            mention a change to how data is stored.

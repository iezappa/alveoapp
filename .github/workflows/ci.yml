name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "stable": a CI that silently changes toolchain under you is a
  # CI that fails for reasons unrelated to the commit under test.
  FLUTTER_VERSION: 3.47.1

defaults:
  run:
    working-directory: apps/client

jobs:
  check:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: dart analyze lib test

      - name: Test
        run: flutter test

  integration:
    name: Integration test (Linux desktop)
    runs-on: ubuntu-latest
    # These drive the real app, which is slower and worth nothing if the unit
    # tests are already red.
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The Linux desktop shell is a real GTK application, so it needs GTK and
      # a display even when nobody is watching.
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
        working-directory: .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run the flows end to end
        run: xvfb-run -a flutter test integration_test -d linux

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    # dart2js catches things the analyser does not, but there is no point
    # compiling a tree whose tests are already red.
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build
        run: flutter build web --release

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    # Debug only: release builds need the keystore, which never reaches CI
    # (docs/SIGNING.md). This catches Gradle, manifest and plugin breakage.
    # The runner image already carries the Android SDK.
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build
        run: flutter build apk --debug

      - name: Check the release signing scripts
        run: bash tool/release_apk_test.sh

name: Deploy web (PWA)

# Builds the Flutter web app and publishes it to GitHub Pages on every push
# to the default branch. Open the resulting URL in Safari on iPhone and use
# "Add to Home Screen" to install it as a PWA.
#
# If this repo is a USER site (named <you>.github.io) or uses a custom domain,
# change BASE_HREF below to "/".

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Pinned, not "stable": keep in step with ci.yml and release.yml.
env:
  FLUTTER_VERSION: 3.47.1

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve base href
        id: base
        run: echo "value=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      # Nothing ships without passing first. This job used to build and
      # publish whatever was on the branch, so a red suite reached the
      # people using the app.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: dart analyze lib test

      - name: Test
        run: flutter test

      - run: flutter build web --release --base-href "${{ steps.base.outputs.value }}"

      - name: SPA + Pages tweaks
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      # Our own service worker (§8.2): Flutter's only unregisters itself, so
      # without this the PWA would not open offline. Last step that touches
      # build/web — the manifest hashes every file that is there, and sw.js
      # is registered relative to the base href, so its scope is /<repo>/.
      - name: Generate the service worker
        run: sh tool/generate_sw.sh build/web pubspec.yaml

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/client/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Server block for nginxinc/nginx-unprivileged (replaces conf.d/default.conf).
#
# Notes on headers
# ----------------
# nginx drops ALL inherited add_header directives in a location that defines
# its own add_header. That is why the security/isolation headers are repeated
# in every location below.
#
# Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy:
#   Drift web docs: COOP "same-origin" + COEP "require-corp" (or
#   "credentialless") enable the fastest OPFS-based implementation
#   (synchronous file access via SharedArrayBuffer / Atomics.wait). Without
#   them Drift still works but falls back to IndexedDB-based storage.
#   https://drift.simonbinder.eu/platforms/web/
#   "require-corp" is used because Safari does not support "credentialless".
#   Consequence: every cross-origin resource must send CORP/CORS headers.
#   The Dockerfile builds with --no-web-resources-cdn so CanvasKit is served
#   from this origin. If the app loads other third-party resources (e.g.
#   fallback fonts from fonts.gstatic.com, images from other hosts), test them
#   in the browser console; remove COEP if something breaks and accept the
#   IndexedDB fallback.
#
# Content-Security-Policy (documents only: the entry points and the SPA
# fallback; a header on a .js or .wasm response governs nothing):
#   default-src 'self'      everything comes from this origin. The app has no
#                           backend and loads no third-party resource: the
#                           Dockerfile builds with --no-web-resources-cdn, so
#                           CanvasKit is local, and the update check reads
#                           update.json from this same origin.
#   script-src              'wasm-unsafe-eval' is required: CanvasKit, skwasm
#                           and sqlite3.wasm are WebAssembly, and without it
#                           the app does not start. blob: is required too —
#                           Flutter's loader starts its renderer workers from
#                           a blob URL. No 'unsafe-eval' and no 'unsafe-inline':
#                           index.html has a single external <script>.
#   style-src 'unsafe-inline'  Flutter injects its own <style> elements (glass
#                           pane layout, @font-face) at runtime; there is no
#                           nonce to give them.
#   img-src / font-src data:, blob:  decoded images and exported files.
#   connect-src 'self'      update.json and the asset/wasm fetches. On the web
#                           the update check reads update.json from this origin
#                           (WebUpdateService); api.github.com appears in the
#                           bundle only for the desktop path and is never
#                           called here. CanvasKit's missing-glyph fallback to
#                           fonts.gstatic.com is already blocked by COEP above.
#                           Tightening this is what keeps therapy notes from
#                           being posted anywhere if a script is ever injected.
#   worker-src 'self' blob: drift_worker.js is same-origin; the renderer
#                           workers are blob URLs.
#   object-src 'none', base-uri 'self', form-action 'none', frame-ancestors
#                           'none'  no plugins, no <base> rewrite, no form
#                           post, and the app cannot be framed (clickjacking).
#   X-Frame-Options mirrors frame-ancestors for older browsers, and
#   Referrer-Policy: no-referrer keeps the deep-link path out of the Referer
#   of anything the user opens from inside the app.
#
#   Verified against the release web build of this commit (the directives were
#   read off the built output: one external script, WASM, blob workers, no
#   third-party origin). Not yet exercised in a browser against the Docker
#   image — do that on the next deploy and check the console for CSP reports.
#
# Caching:
#   Flutter web does NOT content-hash its main files (main.dart.js,
#   flutter_bootstrap.js, canvaskit/*). Long immutable caching would pin users
#   to old code, so code files use "no-cache" (always revalidated via ETag,
#   a cheap 304 when unchanged). Only static assets get a medium cache.
#   Offline use is handled by web/sw.js: it precaches with cache: "reload", so
#   the stored responses keep these headers (COOP/COEP/CORP) when served offline.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json application/wasm
        image/svg+xml font/ttf font/otf;

    # Liveness endpoint for the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache the entry points: they decide which version the user runs.
    # sw.js (own service worker) must always be revalidated, or users stay on an
    # old worker; its scope is "/" (same folder), so no Service-Worker-Allowed.
    # update.json is fetched network-only by the app and the worker.
    location ~ ^/(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js|manifest\.json|version\.json|update\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Documents only (see the CSP note at the top of this file).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # WebAssembly (sqlite3.wasm, CanvasKit, skwasm). Browsers require
    # application/wasm for streaming compilation.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # JavaScript modules (.mjs is not in nginx's default mime.types) and
    # regular JS (main.dart.js, drift_worker.js, canvaskit loaders).
    location ~* \.(mjs|js)$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets (images, fonts, icons). Not hashed either, so a moderate
    # cache instead of "immutable".
    location ~* ^/(assets|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (go_router path URLs) load index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Documents only (see the CSP note at the top of this file).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
